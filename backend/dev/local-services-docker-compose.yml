services:
  db:
    image: postgres:17
    container_name: postgres
    ports: 
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: fileshare
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      
volumes:
  postgres_data: 